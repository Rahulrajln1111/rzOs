# rzOs - Limine boot config (v11 syntax)

# Put the Limine console on the serial port for headless debugging
# (make run uses -serial stdio).
serial: yes

# Timeout in seconds before auto-booting the first entry.
timeout: 3

/rzOs
    # We use the Limine boot protocol.
    protocol: limine

    # boot():/ is the partition (ESP) on which limine.conf is located.
    path: boot():/kernel.elf
